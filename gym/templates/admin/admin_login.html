{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login | FITFLOW HUB</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{% static 'assets/css/fitflow-admin.css' %}">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;

            background: #0b0d10;
            color: #f5f5f5;

            font-family: Inter, Arial, sans-serif;

            padding: 24px;
        }

        .login-card {
            width: min(430px, 100%);

            background: #14171b;

            border: 1px solid #2b3037;

            border-radius: 18px;

            padding: 34px;

            box-shadow: 0 24px 70px rgba(0, 0, 0, .45);
        }

        .brand {
            font-family: Montserrat, sans-serif;

            font-weight: 900;

            font-size: 28px;

            text-align: center;

            margin-bottom: 6px;
        }

        .brand span {
            color: #ff6b1a;
        }

        .subtitle {
            text-align: center;

            color: #9ca3af;

            margin: 0 0 28px;
        }

        .field {
            margin-bottom: 18px;
        }

        label {
            display: block;

            margin-bottom: 8px;

            font-weight: 600;

            font-size: 14px;
        }

        input {
            width: 100%;

            padding: 13px 14px;

            border: 1px solid #353b44;

            border-radius: 10px;

            background: #0d1014;

            color: #fff;

            outline: none;

            font-size: 15px;
        }

        input:focus {
            border-color: #ff6b1a;
        }

        button {
            width: 100%;

            border: 0;

            border-radius: 10px;

            padding: 14px;

            background: #ff6b1a;

            color: #fff;

            font-weight: 800;

            cursor: pointer;

            font-size: 15px;
        }

        button:hover {
            filter: brightness(1.08);
        }

        .error {
            background: rgba(220, 38, 38, .12);

            border: 1px solid #ef4444;

            color: #fca5a5;

            padding: 11px 13px;

            border-radius: 10px;

            margin-bottom: 18px;

            font-size: 14px;
        }

        .back {
            display: block;

            text-align: center;

            color: #9ca3af;

            margin-top: 20px;

            text-decoration: none;

            font-size: 14px;
        }

        .back:hover {
            color: #ff6b1a;
        }
    </style>
</head>

<body>

    <div class="login-card">

        <div class="brand">
            <span>FITFLOW</span> HUB
        </div>

        <p class="subtitle">
            Administrator Portal
        </p>


        {% if messages %}

            {% for message in messages %}

                <div class="error">
                    {{ message }}
                </div>

            {% endfor %}

        {% endif %}


        {% if error %}

            <div class="error">
                {{ error }}
            </div>

        {% endif %}


        <form method="post">

            {% csrf_token %}

            <div class="field">

                <label for="username">
                    Admin Email / Username
                </label>

                <input
                    id="username"
                    type="text"
                    name="username"
                    placeholder="Enter admin email"
                    required
                    autofocus
                >

            </div>


            <div class="field">

                <label for="password">
                    Password
                </label>

                <input
                    id="password"
                    type="password"
                    name="password"
                    placeholder="Enter password"
                    required
                >

            </div>


            <button type="submit">
                Login to Dashboard
            </button>

        </form>


        <a href="/" class="back">
            ← Back to FITFLOW HUB
        </a>

    </div>

</body>
</html>
